name: Build Job
on: 
  push:
    branches: 
      - main


permissions:
   contents : read
jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Maven Build
        run: mvn install

      - name: upload Build Artifact (WAR)
        uses : actions/upload-artifact@v4
        with :
           name: vprofile-app
           path : target/*.war
      - name : Notify if Build Fails
         if : failue()
         run : echo "Build job failed!!:)"


  Testing:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Run tests on main branch
        run: mvn test

      - name: Checkstyle
        run: mvn checkstyle:checkstyle